services:
  mysql:
    image: mysql:8.4
    container_name: mind_blog_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mind_blog}
      MYSQL_USER: ${MYSQL_USER:-mind_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mind_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - "CMD"
        - "mysqladmin"
        - "ping"
        - "-h"
        - "localhost"
        - "-uroot"
        - "-p${MYSQL_ROOT_PASSWORD:-root_password}"
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: mind_blog_api
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3333}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      DATABASE_URL: ${DATABASE_URL:-mysql://mind_user:mind_password@mysql:3306/mind_blog}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_before_deploy}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-cassianomeloprofissional@gmail.com}
      SMTP_PASS: ${SMTP_PASS:-dupr xinq dejh nwbl}
      SMTP_FROM: ${SMTP_FROM:-Mind Blog <no-reply@mindblog.local>}
    ports:
      - "${PORT:-3333}:3333"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    command: sh -c "npx prisma migrate deploy && npm run dev"

volumes:
  mysql_data:

services:
  mysql:
    image: mysql:8.4
    container_name: mind_blog_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mind_blog
      MYSQL_USER: mind_user
      MYSQL_PASSWORD: mind_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: mind_blog_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3333:3333"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    command: sh -c "npx prisma migrate deploy && npm run dev"

volumes:
  mysql_data:
